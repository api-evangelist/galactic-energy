source: live probes of /.well-known/* and agent-discovery paths on every Galactic Energy host
notes: >-
  Galactic Energy publishes a single public host, www.galactic-energy.cn (the apex
  galactic-energy.cn resolves to the same nginx origin and behaves identically). No
  api., developer. or docs. subdomain resolves at all — DNS returns no answer, so
  there is no second host to probe. Every /.well-known/ path, plus /security.txt,
  /llms.txt, /robots.txt, /openapi.json, /swagger.json, /graphql, /asyncapi.yaml and
  /apis.json, returns the origin's generic nginx HTTP 404 page. Nothing here is a
  bot wall or a JS shell: the 404s are real absences, recorded so a later round does
  not have to re-probe. No RFC 9116 security.txt, no OIDC/OAuth 2.0 authorization-server
  metadata, no RFC 9727 api-catalog, no ai-plugin.json and no A2A agent card exists on
  any Galactic Energy host, at either the canonical /.well-known/agent-card.json path
  or the pre-0.3 /.well-known/agent.json path. Because nothing was found, this file
  carries NO apis.yml pointer — it is a record of the probe, not a discovery surface.
