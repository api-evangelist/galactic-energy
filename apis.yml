aid: galactic-energy
name: Galactic Energy
description: 'Galactic Energy (星河动力航天 — Galactic Energy (Beijing) Space Technology Co.,
  Ltd.) is a private Chinese commercial launch company founded on 6 February 2018 and
  headquartered in Beijing E-Town. It builds and flies the Ceres family of solid-propellant
  small-lift rockets (Ceres-1, the sea-launched Ceres-1S, and the larger 3.35 m Ceres-2)
  and is developing the partly reusable liquid oxygen/kerosene Pallas-1 and Pallas-2
  medium-lift vehicles, the Eros vehicle, the Welkin (苍穹) CQ-series liquid propellant
  engines, and the Edge attitude and orbital control system. Its public web surface is
  a corporate marketing site at galactic-energy.cn carrying product pages, a launch plan,
  completed-mission history, a news feed, careers listings, a Chinese-language document
  centre of launch-vehicle user manuals (PDF), and an HTML launch-reservation form.
  Contract discovery on 2026-08-04 found no developer portal, no API documentation and
  no machine-readable API surface of any kind: every probe for OpenAPI/Swagger, GraphQL,
  MCP, an A2A agent card, /llms.txt, robots.txt and the full /.well-known/ discovery
  set returned HTTP 404 on every galactic-energy.cn host, and no api./developer./docs.
  subdomain resolves. This profile is therefore identity and domain-security only.'
